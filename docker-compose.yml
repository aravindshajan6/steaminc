# Two services, one published port.
#
#   browser ──► frontend :8080 ──┬── static files (nginx)
#                                └── /api/* proxied to backend:5173
#
# The backend has no `ports:` entry, so Docker never binds it to a host interface.
# It is reachable only from the private compose network, by name, from the proxy.

services:
  backend:
    build: ./backend
    image: steaminc-backend
    restart: unless-stopped
    # No `ports:` — this is the whole point. Adding one would expose the API,
    # and with it the unauthenticated endpoints, directly to the host network.
    expose:
      - "5173"
    environment:
      PORT: 5173
      DATA_DIR: /app/state
      DEFAULT_REGION: ${DEFAULT_REGION:-US}
      # Read from the .env file beside this compose file. Never baked into the image.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Unset  -> accounts live in a JSON file on the volume below.
      # Set    -> accounts live in Mongo and the volume is unused.
      # `docker compose --profile mongo up` starts the local mongo service and
      # points at it; an Atlas connection string works here just as well.
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-steaminc}
    volumes:
      # Accounts and sessions survive rebuilds. Mounted at /app/state, NOT /app/data,
      # so it cannot shadow the demo data baked into the image.
      - steaminc-state:/app/state
    networks:
      - steaminc

  frontend:
    build: ./frontend
    image: steaminc-frontend
    restart: unless-stopped
    ports:
      # Host access happens here and nowhere else. 127.0.0.1 binds to loopback only,
      # so it is not served to the rest of the network; drop the prefix to publish it.
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - steaminc

  # Local Mongo for trying the database path without an Atlas account.
  # Off by default: `docker compose --profile mongo up -d`
  # It publishes no port either — only the backend needs to reach it.
  mongo:
    image: mongo:7
    profiles: ["mongo"]
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - steaminc-mongo:/data/db
    networks:
      - steaminc
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  steaminc:
    driver: bridge

volumes:
  steaminc-state:
  steaminc-mongo:
