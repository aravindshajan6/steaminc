server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx runs unprivileged in the alpine image; 8080 avoids needing port 80.
    absolute_redirect off;

    # Don't advertise the exact nginx build to the internet.
    server_tokens off;

    # Basic hardening. No CSP here because it needs to allow TMDB/Archive images,
    # YouTube embeds and Archive video — see the README before tightening it.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # The API reaches the browser only through here. The backend publishes no host
    # port, so this proxy is the single way in — which is also what keeps the API
    # same-origin, so the session cookie (HttpOnly, SameSite=Lax) just works and
    # no CORS configuration is needed anywhere.
    location /api/ {
        proxy_pass http://backend:5173;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The backend reads the first entry of this for per-user login throttling.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The free-copy cross-match can wait on archive.org, which is not always quick.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        # Responses are JSON and often small; buffering adds nothing but latency.
        proxy_buffering off;
    }

    # No build step means no content hashing, so cached JS would serve stale code.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Client-side hash routes are all served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
